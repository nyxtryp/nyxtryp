name: NYXTRYP Auto Edit

on:
  workflow_dispatch:
    inputs:
      command:
        description: "One-line shell command"
        required: true
        type: string

permissions:
  contents: write

jobs:
  auto-edit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run edit command
        env:
          EDIT_COMMAND: ${{ inputs.command }}
        run: |
          bash -lc "$EDIT_COMMAND"

      - name: Build
        run: |
          npm install
          npm run build

      - name: Commit and push
        run: |
          git config user.name "NYXTRYP Auto"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "auto: update NYXTRYP"
          git push
