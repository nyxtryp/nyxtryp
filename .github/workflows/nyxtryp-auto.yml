name: NYXTRYP Auto Edit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-edit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch gallery thumbnail synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/scene/planets/PlanetField.jsx')
          text = path.read_text()

          old_fetch = '''              if (photos.length) {
                index = Math.min(index, photos.length - 1)
                update()
              }
'''
          new_fetch = '''              if (photos.length) {
                index = Math.min(index, photos.length - 1)
                syncThumbs()
                update()
              }
'''
          if old_fetch not in text:
              raise SystemExit('fetch block not found')
          text = text.replace(old_fetch, new_fetch, 1)

          old_update = '''          const update = () => {
            image.src = photos[index]

            thumbList.forEach((t, i) => {
              t.style.opacity = i === index ? "1" : "0.45"
              t.style.borderColor =
                i === index
                  ? "rgba(255,255,255,0.95)"
                  : "rgba(255,255,255,0.25)"
            })

            if (thumbList[index]) {
              thumbList[index].scrollIntoView({
                behavior: "smooth",
                block: "nearest",
                inline: "center"
              })
            }
          }

          photos.forEach((src, i) => {
            const t = document.createElement("button")

            Object.assign(t.style, {
              flex: "0 0 72px",
              width: "72px",
              height: "62px",
              padding: "0",
              border: "1px solid rgba(255,255,255,0.25)",
              background: "#080808",
              overflow: "hidden",
              cursor: "pointer",
              opacity: "0.45"
            })

            const ti = document.createElement("img")
            ti.src = src

            Object.assign(ti.style, {
              width: "100%",
              height: "100%",
              objectFit: "cover",
              display: "block"
            })

            t.appendChild(ti)

            t.onclick = () => {
              index = i
              update()
            }

            thumbs.appendChild(t)
            thumbList.push(t)
          })
'''
          new_update = '''          const syncThumbs = () => {
            thumbs.innerHTML = ""
            thumbList.length = 0

            photos.forEach((src, i) => {
              const t = document.createElement("button")

              Object.assign(t.style, {
                flex: "0 0 72px",
                width: "72px",
                height: "62px",
                padding: "0",
                border: "1px solid rgba(255,255,255,0.25)",
                background: "#080808",
                overflow: "hidden",
                cursor: "pointer",
                opacity: "0.45"
              })

              const ti = document.createElement("img")
              ti.src = src

              Object.assign(ti.style, {
                width: "100%",
                height: "100%",
                objectFit: "cover",
                display: "block"
              })

              t.appendChild(ti)

              t.onclick = () => {
                index = i
                update()
              }

              thumbs.appendChild(t)
              thumbList.push(t)
            })
          }

          const update = () => {
            image.src = photos[index]

            thumbList.forEach((t, i) => {
              t.style.opacity = i === index ? "1" : "0.45"
              t.style.borderColor =
                i === index
                  ? "rgba(255,255,255,0.95)"
                  : "rgba(255,255,255,0.25)"
            })

            if (thumbList[index]) {
              thumbList[index].scrollIntoView({
                behavior: "smooth",
                block: "nearest",
                inline: "center"
              })
            }
          }

          syncThumbs()
'''
          if old_update not in text:
              raise SystemExit('thumbnail block not found')
          text = text.replace(old_update, new_update, 1)

          path.write_text(text)
          print('Gallery thumbnail sync patched')
          PY

      - name: Build
        run: |
          npm install
          npm run build

      - name: Restore workflow and commit
        run: |
          cat > .github/workflows/nyxtryp-auto.yml <<'EOF'
          name: NYXTRYP Auto Edit

          on:
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: write

          jobs:
            auto-edit:
              runs-on: ubuntu-latest

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Run Python edit
                  run: python3 .nyxtryp/command.py

                - name: Build
                  run: |
                    npm install
                    npm run build

                - name: Commit and push
                  run: |
                    git config user.name "NYXTRYP Auto"
                    git config user.email "actions@github.com"
                    git add -A
                    if git diff --cached --quiet; then
                      echo "No changes."
                      exit 0
                    fi
                    git commit -m "auto: apply NYXTRYP edit"
                    git push
          EOF
          git config user.name "NYXTRYP Auto"
          git config user.email "actions@github.com"
          git add src/scene/planets/PlanetField.jsx .github/workflows/nyxtryp-auto.yml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "fix: sync gallery thumbnails with media API"
          git push
