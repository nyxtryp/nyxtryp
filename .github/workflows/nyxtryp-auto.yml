name: NYXTRYP Auto Edit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-edit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Python edit
        run: python3 .nyxtryp/command.py

      - name: Build
        run: |
          npm install
          npm run build

      - name: Commit and push
        run: |
          git config user.name "NYXTRYP Auto"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "auto: apply NYXTRYP edit"
          git push
