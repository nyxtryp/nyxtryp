name: NYXTRYP Auto Edit

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Python code"
        required: true
        type: string

permissions:
  contents: write

jobs:
  auto-edit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run Python edit
        env:
          EDIT_SCRIPT: ${{ inputs.script }}
        run: |
          printf '%s' "$EDIT_SCRIPT" > /tmp/edit.py
          python3 /tmp/edit.py

      - name: Build
        run: |
          npm install
          npm run build

      - name: Commit and push
        run: |
          git config user.name "NYXTRYP Auto"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "auto: update NYXTRYP"
          git push
