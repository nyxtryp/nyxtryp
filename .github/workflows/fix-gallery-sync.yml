name: Fix gallery thumbnail sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gallery-sync.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch gallery thumbnail synchronization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/scene/planets/PlanetField.jsx')
          text = path.read_text()

          old_fetch = '''              if (photos.length) {
                index = Math.min(index, photos.length - 1)
                update()
              }
'''
          new_fetch = '''              if (photos.length) {
                index = Math.min(index, photos.length - 1)
                syncThumbs()
                update()
              }
'''

          if old_fetch not in text:
              raise SystemExit('fetch block not found')
          text = text.replace(old_fetch, new_fetch, 1)

          old_update = '''          const update = () => {
            image.src = photos[index]

            thumbList.forEach((t, i) => {
              t.style.opacity = i === index ? "1" : "0.45"
              t.style.borderColor =
                i === index
                  ? "rgba(255,255,255,0.95)"
                  : "rgba(255,255,255,0.25)"
            })

            if (thumbList[index]) {
              thumbList[index].scrollIntoView({
                behavior: "smooth",
                block: "nearest",
                inline: "center"
              })
            }
          }

          photos.forEach((src, i) => {
            const t = document.createElement("button")

            Object.assign(t.style, {
              flex: "0 0 72px",
              width: "72px",
              height: "62px",
              padding: "0",
              border: "1px solid rgba(255,255,255,0.25)",
              background: "#080808",
              overflow: "hidden",
              cursor: "pointer",
              opacity: "0.45"
            })

            const ti = document.createElement("img")
            ti.src = src

            Object.assign(ti.style, {
              width: "100%",
              height: "100%",
              objectFit: "cover",
              display: "block"
            })

            t.appendChild(ti)

            t.onclick = () => {
              index = i
              update()
            }

            thumbs.appendChild(t)
            thumbList.push(t)
          })
'''
          new_update = '''          const syncThumbs = () => {
            thumbs.innerHTML = ""
            thumbList.length = 0

            photos.forEach((src, i) => {
              const t = document.createElement("button")

              Object.assign(t.style, {
                flex: "0 0 72px",
                width: "72px",
                height: "62px",
                padding: "0",
                border: "1px solid rgba(255,255,255,0.25)",
                background: "#080808",
                overflow: "hidden",
                cursor: "pointer",
                opacity: "0.45"
              })

              const ti = document.createElement("img")
              ti.src = src

              Object.assign(ti.style, {
                width: "100%",
                height: "100%",
                objectFit: "cover",
                display: "block"
              })

              t.appendChild(ti)

              t.onclick = () => {
                index = i
                update()
              }

              thumbs.appendChild(t)
              thumbList.push(t)
            })
          }

          const update = () => {
            image.src = photos[index]

            thumbList.forEach((t, i) => {
              t.style.opacity = i === index ? "1" : "0.45"
              t.style.borderColor =
                i === index
                  ? "rgba(255,255,255,0.95)"
                  : "rgba(255,255,255,0.25)"
            })

            if (thumbList[index]) {
              thumbList[index].scrollIntoView({
                behavior: "smooth",
                block: "nearest",
                inline: "center"
              })
            }
          }

          syncThumbs()
'''

          if old_update not in text:
              raise SystemExit('thumbnail block not found')
          text = text.replace(old_update, new_update, 1)

          path.write_text(text)
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scene/planets/PlanetField.jsx
          git diff --cached --exit-code && { echo 'No changes'; exit 0; }
          git commit -m 'fix: sync gallery thumbnails with media API'
          git push origin main

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-gallery-sync.yml || true
          git commit -m 'chore: remove gallery sync workflow' || true
          git push origin main || true
