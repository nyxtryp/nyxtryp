name: fix-admin-upload
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch upload handler only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/AdminPanel.jsx')
          s = p.read_text()
          old = """  const upload = async e => {\n    const selected = Array.from(e.target.files || [])\n    e.target.value = ''\n    if (!selected.length) {\n"""
          new = """  const upload = async e => {\n    const inputElement = e.currentTarget\n    const selected = Array.from(inputElement.files || [])\n    if (!selected.length) {\n"""
          if old not in s:
              raise SystemExit('upload handler source not found')
          s = s.replace(old, new, 1)
          old2 = """    } finally {\n      setBusy(false)\n    }\n  }\n\n  const remove = async name => {\n"""
          new2 = """    } finally {\n      setBusy(false)\n      inputElement.value = ''\n    }\n  }\n\n  const remove = async name => {\n"""
          if old2 not in s:
              raise SystemExit('upload finally block source not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/components/AdminPanel.jsx
          rm .github/workflows/fix-admin-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminPanel.jsx .github/workflows/fix-admin-upload.yml
          git commit -m "fix: preserve selected file during admin upload"
          git push origin main
